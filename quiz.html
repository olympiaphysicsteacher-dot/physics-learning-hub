<!DOCTYPE html>
<html>
<head>
  <style>
  .correct { color: green; font-weight: bold; }
  .wrong { color: red; font-weight: bold; }
  .explanation { margin-top: 10px; }
</style>
  <title>Practice Test</title>
</head>
<body style="font-family: Arial; text-align: center;">

<h1>📝 Practice Test</h1>

<!-- 🎯 CONTROLS -->
<div>
  <label>Topic:</label>
  <select id="topic">
    <option value="all">All</option>
    <option value="kinematics">Kinematics</option>
    <option value="forces">Forces</option>
  </select>

  <label>Difficulty:</label>
  <select id="difficulty">
    <option value="all">All</option>
    <option value="easy">Easy</option>
    <option value="medium">Medium</option>
    <option value="hard">Hard</option>
  </select>

  <br><br>
  <button onclick="startQuiz()">Start Quiz</button>
</div>

<hr>

<div id="quiz-box"></div>

<script>

// 🔥 QUESTION BANK
const questions = [
  {
    topic: "kinematics",
    difficulty: "easy",
    question: "What is velocity?",
    options: ["Speed with direction", "Distance/time", "Force", "Energy"],
    answer: 0,
    explanation: "Velocity includes both speed and direction."
  },
  {
    topic: "kinematics",
    difficulty: "hard",
    question: "Velocity of an object increases uniformlly from 0 m/s to 5 m/s in 2 seconds. What is the displacement of the object?",
    options: ["0 m", "10 m", "5 m", "2 m"],
    answer: 2,
    explanation: "apply d = (v+u)t/2."
  },
   {
    topic: "kinematics",
    difficulty: "medium",
    question: "Unit of acceleration?",
    options: ["m/s", "m/s²", "N", "kg"],
    answer: 1,
    explanation: "Acceleration is the rate change of velocity."
  },
  {
    topic: "forces",
    difficulty: "easy",
    question: "Unit of force?",
    options: ["N", "kg", "m/s", "J"],
    answer: 0,
    explanation: "Unit of force is named after Sir Issac Newton."
  },
  {
    topic: "forces",
    difficulty: "medium",
    question: "What is Newton's Second Law?",
    options: ["F = ma", "E = mc²", "V = IR", "p = mv"],
    answer: 0,
    explanation: "Force causes change in state of motion."
  },
  {
    topic: "forces",
    difficulty: "hard",
    question: "If mass doubles, acceleration becomes?",
    options: ["Double", "Half", "Same", "Zero"],
    answer: 1
  }
];

let filteredQuestions = [];
let current = 0;
let score = 0;

// 🎯 START QUIZ
function startQuiz() {
  const topic = document.getElementById("topic").value;
  const difficulty = document.getElementById("difficulty").value;

  // 🔍 FILTER
  filteredQuestions = questions.filter(q => {
    return (topic === "all" || q.topic === topic) &&
           (difficulty === "all" || q.difficulty === difficulty);
  });

  // 🎲 RANDOMIZE (shuffle)
  filteredQuestions.sort(() => Math.random() - 0.5);

  // limit to 5 questions (optional)
  filteredQuestions = filteredQuestions.slice(0, 5);

  current = 0;
  score = 0;

  if (filteredQuestions.length === 0) {
    document.getElementById("quiz-box").innerHTML =
      "<p>No questions found. Try different filters.</p>";
    return;
  }

  showQuestion();
}

// 📌 SHOW QUESTION
function showQuestion() {
  let q = filteredQuestions[current];

  let html = "<h3>" + q.question + "</h3>";

  q.options.forEach((opt, i) => {
    html += `<button onclick="checkAnswer(${i})">${opt}</button><br><br>`;
  });

  document.getElementById("quiz-box").innerHTML = html;
}

// ✅ CHECK ANSWER
function checkAnswer(choice) {
  let q = filteredQuestions[current];

  let html = "";

  if (choice === q.answer) {
    score++;
    html += "<p class='correct'>✅ Correct!</p>";
  } else {
    html += "<p class='wrong'>❌ Wrong!</p>";
  }

  // show explanation
  html += `<p class="explanation">${q.explanation}</p>`;

  current++;

  if (current < filteredQuestions.length) {
    html += `<button onclick="showQuestion()">Next Question</button>`;
  } else {
    html += `<h2>Final Score: ${score}/${filteredQuestions.length}</h2>`;
  }

  document.getElementById("quiz-box").innerHTML = html;
}

</script>

<br>
<a href="index.html">⬅ Back</a>

</body>
</html>
